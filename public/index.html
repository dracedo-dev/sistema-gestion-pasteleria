<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Pastelería</title>
    <!-- Bootstrap CDN para estilizar rápido -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Pastelería Artesanal</a>
            <a href="/admin.html" class="btn btn-outline-light btn-sm">Panel Admin</a>
        </div>
    </nav>

    <div class="container my-5">
        <h1 class="text-center mb-4">Nuestro Menú</h1>
        
        <!-- Buscador -->
        <div class="row justify-content-center mb-4">
            <div class="col-md-6">
                <input type="text" id="searchInput" class="form-control" placeholder="Buscar productos (ej. Torta)...">
            </div>
        </div>

        <!-- Contenedor de productos -->
        <div id="productosContainer" class="row">
            <!-- Los productos se cargarán dinámicamente con JavaScript -->
        </div>
    </div>

    <!-- Script para consumir la API -->
    <script>
        const cargarProductos = async (query = '') => {
            try {
                const url = query ? `http://localhost:3000/api/productos?q=${query}` : 'http://localhost:3000/api/productos';
                const response = await fetch(url);
                const productos = await response.json();
                
                const container = document.getElementById('productosContainer');
                container.innerHTML = '';

                if (productos.length === 0) {
                    container.innerHTML = '<p class="text-center text-muted">No se encontraron productos.</p>';
                    return;
                }

                productos.forEach(prod => {
                    container.innerHTML += `
                        <div class="col-md-4 mb-3">
                            <div class="card h-100 shadow-sm">
                                <div class="card-body">
                                    <h5 class="card-title">${prod.nombre_producto}</h5>
                                    <h6 class="card-subtitle mb-2 text-muted">${prod.nombre_categoria}</h6>
                                    <p class="card-text">${prod.descripcion || 'Sin descripción'}</p>
                                    <p class="fw-bold text-success">$${prod.precio_base}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error al cargar productos:', error);
            }
        };

        // Evento de búsqueda en tiempo real
        document.getElementById('searchInput').addEventListener('input', (e) => {
            cargarProductos(e.target.value);
        });

        // Carga inicial
        cargarProductos();
    </script>
</body>
</html>
