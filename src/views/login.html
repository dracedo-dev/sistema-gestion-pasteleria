<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso y Registro - Pastelería TFI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow p-4 w-100" style="max-width: 420px;">
        <div class="text-center mb-3">
            <h3>🧁 Pastelería TFI</h3>
            <p class="text-muted" id="subtituloForm">Inicia sesión en tu cuenta</p>
        </div>

        <!-- FORMULARIO DE LOGIN -->
        <form id="formLogin">
            <div class="mb-3">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" id="loginEmail" class="form-control" required placeholder="correo@ejemplo.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña <small class="text-muted">(Solo para Admin / Personal)</small></label>
                <input type="password" id="loginPassword" class="form-control" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-success w-100 mb-2">Ingresar</button>
            <div class="text-center">
                <button type="button" class="btn btn-link btn-sm text-decoration-none" onclick="alternarVista('registro')">¿No tienes cuenta? Regístrate aquí</button>
            </div>
        </form>

        <!-- FORMULARIO DE REGISTRO -->
        <form id="formRegistro" class="d-none">
            <div class="mb-3">
                <label class="form-label">Nombre Completo</label>
                <input type="text" id="regNombre" class="form-control" required placeholder="Tu Nombre">
            </div>
            <div class="mb-3">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" id="regEmail" class="form-control" required placeholder="correo@ejemplo.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" id="regPassword" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-2">Crear Cuenta</button>
            <div class="text-center">
                <button type="button" class="btn btn-link btn-sm text-decoration-none" onclick="alternarVista('login')">¿Ya tienes cuenta? Inicia sesión</button>
            </div>
        </form>
    </div>

    <script>
        const API = 'http://localhost:3000/api';

        function alternarVista(vista) {
            const fLogin = document.getElementById('formLogin');
            const fRegistro = document.getElementById('formRegistro');
            const subtitulo = document.getElementById('subtituloForm');

            if (vista === 'registro') {
                fLogin.classList.add('d-none');
                fRegistro.classList.remove('d-none');
                subitulo.innerText = 'Crea tu cuenta de cliente';
            } else {
                fRegistro.classList.add('d-none');
                fLogin.classList.remove('d-none');
                subitulo.innerText = 'Inicia sesión en tu cuenta';
            }
        }

        // Procesar Login
        document.getElementById('formLogin').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch(`${API}/usuarios/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (!res.ok) {
                    alert(data.error || 'Error al iniciar sesión');
                    return;
                }

                localStorage.setItem('usuarioLogueado', JSON.stringify(data.usuario));
                window.location.href = data.redireccion;

            } catch (err) {
                console.error('Error de red:', err);
            }
        };

        // Procesar Registro de Cliente
        document.getElementById('formRegistro').onsubmit = async (e) => {
            e.preventDefault();
            const nombre_completo = document.getElementById('regNombre').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            try {
                const res = await fetch(`${API}/usuarios/registro`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre_completo, email, password })
                });

                const data = await res.json();
                if (!res.ok) {
                    alert(data.error || 'Error al registrarse');
                    return;
                }

                alert('¡Cuenta creada con éxito! Ahora puedes iniciar sesión.');
                alternarVista('login');
            } catch (err) {
                console.error('Error de red:', err);
            }
        };
    </script>
</body>
</html>
