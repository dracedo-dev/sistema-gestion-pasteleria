<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso y Registro - Pastelería TFI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow p-4 w-100" style="max-width: 420px;">
        <div class="text-center mb-3">
            <h3>🧁 Pastelería TFI</h3>
            <p class="text-muted" id="subtituloForm">Inicia sesión en tu cuenta</p>
        </div>

        <!-- FORMULARIO DE LOGIN -->
        <form id="formLogin">
            <div class="mb-3">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" id="loginEmail" class="form-control" required placeholder="correo@ejemplo.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña <small class="text-muted">(Solo para Admin / Personal)</small></label>
                <input type="password" id="loginPassword" class="form-control" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-success w-100 mb-2">Ingresar</button>
            <div class="text-center">
                <button type="button" class="btn btn-link btn-sm text-decoration-none" onclick="alternarVista('registro')">¿No tienes cuenta? Regístrate aquí</button>
            </div>
        </form>

        <!-- FORMULARIO DE REGISTRO -->
        <form id="formRegistro" class="d-none">
            <div class="mb-3">
                <label class="form-label">Nombre Completo</label>
                <input type="text" id="regNombre" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">DNI</label>
                <input type="text" id="regDni" class="form-control" required placeholder="Ej: 40123456">
            </div>
            <div class="mb-3">
                <label class="form-label">Teléfono</label>
                <input type="text" id="regTelefono" class="form-control" required placeholder="Ej: 2964123456">
            </div>
            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" id="regEmail" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" id="regPassword" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Registrarse</button>
        </form>
    </div>

    <script>
        const API = 'http://localhost:3000/api';

        function alternarVista(vista) {
            const fLogin = document.getElementById('formLogin');
            const fRegistro = document.getElementById('formRegistro');
            const subtitulo = document.getElementById('subtituloForm');

            if (vista === 'registro') {
                fLogin.classList.add('d-none');
                fRegistro.classList.remove('d-none');
                subtitulo.innerText = 'Crea tu cuenta de cliente';
            } else {
                fRegistro.classList.add('d-none');
                fLogin.classList.remove('d-none');
                subtitulo.innerText = 'Inicia sesión en tu cuenta';
            }
        }

        // Procesar Login
        document.getElementById('formLogin').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch(`${API}/usuarios/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (!res.ok) {
                    alert(data.error || 'Error al iniciar sesión');
                    return;
                }

                localStorage.setItem('usuarioLogueado', JSON.stringify(data.usuario));
                window.location.href = data.redireccion;

            } catch (err) {
                console.error('Error de red:', err);
            }
        };

        // Procesar Registro de Cliente (ID corregido a 'formRegistro')
        document.getElementById('formRegistro').addEventListener('submit', async (e) => {
            e.preventDefault();

            const datos = {
                nombre_completo: document.getElementById('regNombre').value,
                dni: document.getElementById('regDni').value,
                telefono: document.getElementById('regTelefono').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value
            };

            try {
                const res = await fetch(`${API}/usuarios/registro`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                const errorData = await res.json();

                if (res.ok) {
                    alert('¡Registro exitoso! Ya puedes iniciar sesión.');
                    window.location.href = '/login.html';
                } else {
                    alert(errorData.error || 'Error al registrarse');
                }
            } catch (err) {
                console.error('Error de red al registrar:', err);
                alert('Error de conexión con el servidor.');
            }
        });
    </script>
</body>
</html>
