<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes - Admin Pastelería</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        // 1. Obtener la sesión guardada
        const usuarioGuardado = JSON.parse(localStorage.getItem('usuarioLogueado'));

        // 2. Verificar si no existe usuario O si el usuario NO es Administrador
        if (!usuarioGuardado || !usuarioGuardado.nombre_rol || usuarioGuardado.nombre_rol.toLowerCase() !== 'administrador') {
            // Redirigir al login
            // Si tu servidor Express sirve la carpeta 'views' como estática, usa '/login.html'
            // Si accedes directamente por archivo/ruta relativa, usa '../login.html'
            window.location.href = '../login.html'; 
        }
    </script>
</head>
<body class="bg-light">

    <!-- Header Compartido -->
    <div id="header-container"></div>

    <div class="container mt-4">
        <h2 class="mb-4">Gestión de Clientes</h2>

        <!-- SECCIÓN CLIENTES -->
        <div class="card shadow p-4 mb-4 bg-white rounded">
            <div class="row mb-3">
                <div class="col-md-8">
                    <input type="text" id="searchCliente" class="form-control" placeholder="Buscar por DNI, nombre, teléfono o email...">
                </div>
                <div class="col-md-4 text-end">
                    <button class="btn btn-success w-100" onclick="abrirModalCliente()">+ Nuevo Cliente</button>
                </div>
            </div>
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>DNI</th>
                        <th>Nombre Completo</th>
                        <th>Teléfono</th>
                        <th>Email</th>
                        <th>Pedidos</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaClientes"></tbody>
            </table>
            <nav class="mt-3">
                <ul class="pagination justify-content-center" id="paginationClientes"></ul>
            </nav>
        </div>
    </div>

    <!-- MODAL CREAR / EDITAR CLIENTE -->
    <div class="modal fade" id="modalCliente" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="tituloModalCliente">Registrar Nuevo Cliente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="formCliente">
                    <div class="modal-body">
                        <input type="hidden" id="clienteId">
                        <div class="mb-3">
                            <label class="form-label">DNI *</label>
                            <input type="text" id="cliDni" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nombre Completo *</label>
                            <input type="text" id="cliNombre" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono *</label>
                            <input type="text" id="cliTelefono" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="cliEmail" class="form-control">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API = 'http://localhost:3000/api';

        // Carga automática del Header común
        fetch('../partials/header.html')
            .then(res => res.text())
            .then(data => {
                const headerContainer = document.getElementById('header-container');
                if (headerContainer) headerContainer.innerHTML = data;
            });

        function abrirModal(modalId) {
            const modalEl = document.getElementById(modalId);
            if (modalEl) {
                const modal = new bootstrap.Modal(modalEl);
                modal.show();
            }
        }

        function cerrarModal(modalId) {
            const modalEl = document.getElementById(modalId);
            if (modalEl) {
                const modal = bootstrap.Modal.getInstance(modalEl);
                if (modal) modal.hide();
            }
        }

        const bindEvent = (id, event, cb) => {
            const el = document.getElementById(id);
            if (el) el.addEventListener(event, cb);
        };

        const bindSubmit = (formId, modalId, cb) => {
            const form = document.getElementById(formId);
            if (form) {
                form.onsubmit = async e => {
                    e.preventDefault();
                    try {
                        await cb(e);
                        cerrarModal(modalId);
                        form.reset();
                    } catch (err) {}
                };
            }
        };

        // ================= CLIENTES =================
        let paginaActualCli = 1;
        const porPaginaCli = 5;
        let listaClientesCache = [];

        function abrirModalCliente() {
            document.getElementById('formCliente').reset();
            document.getElementById('clienteId').value = '';
            document.getElementById('tituloModalCliente').innerText = 'Registrar Nuevo Cliente';
            abrirModal('modalCliente');
        }

        const cargarClientes = async () => {
            try {
                const searchEl = document.getElementById('searchCliente');
                const q = searchEl ? searchEl.value : '';
                const res = await fetch(`${API}/clientes?q=${q}`);
                listaClientesCache = await res.json();
                renderizarTablaClientes();
            } catch (err) { console.error(err); }
        };

        const renderizarTablaClientes = () => {
            const inicio = (paginaActualCli - 1) * porPaginaCli;
            const fin = inicio + porPaginaCli;
            const datosPagina = listaClientesCache.slice(inicio, fin);

            const tbody = document.getElementById('tablaClientes');
            if (!tbody) return;

            if (datosPagina.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">No se encontraron clientes.</td></tr>`;
                const pagUl = document.getElementById('paginationClientes');
                if (pagUl) pagUl.innerHTML = '';
                return;
            }

            tbody.innerHTML = datosPagina.map(c => `
                <tr>
                    <td>${c.id_cliente}</td>
                    <td>${c.dni}</td>
                    <td class="fw-bold">${c.nombre_completo}</td>
                    <td>${c.telefono}</td>
                    <td>${c.email || '-'}</td>
                    <td><span class="badge bg-info text-dark">${c.pedidos_completados}</span></td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-primary me-1" title="Editar" onclick="prepararEditarCliente(${c.id_cliente}, '${c.dni}', '${c.nombre_completo}', '${c.telefono}', '${c.email || ''}')">✏️</button>
                        <button class="btn btn-sm btn-danger" title="Eliminar" onclick="eliminarCliente(${c.id_cliente})">🗑️</button>
                    </td>
                </tr>
            `).join('');

            renderizarPaginacionClientes();
        };

        const renderizarPaginacionClientes = () => {
            const totalPaginas = Math.ceil(listaClientesCache.length / porPaginaCli);
            const pagUl = document.getElementById('paginationClientes');
            if (!pagUl) return;
            if (totalPaginas <= 1) { pagUl.innerHTML = ''; return; }
            let html = '';
            for (let i = 1; i <= totalPaginas; i++) {
                html += `<li class="page-item ${i === paginaActualCli ? 'active' : ''}"><button class="page-link" onclick="cambiarPaginaCli(${i})">${i}</button></li>`;
            }
            pagUl.innerHTML = html;
        };

        const cambiarPaginaCli = (p) => { paginaActualCli = p; renderizarTablaClientes(); };

        function prepararEditarCliente(id, dni, nombre, telefono, email) {
            document.getElementById('clienteId').value = id;
            document.getElementById('cliDni').value = dni;
            document.getElementById('cliNombre').value = nombre;
            document.getElementById('cliTelefono').value = telefono;
            document.getElementById('cliEmail').value = email;
            document.getElementById('tituloModalCliente').innerText = 'Editar Cliente';
            abrirModal('modalCliente');
        }

        async function eliminarCliente(id) {
            if (!confirm('¿Estás seguro de eliminar este cliente?')) return;
            const res = await fetch(`${API}/clientes/${id}`, { method: 'DELETE' });
            const data = await res.json();
            if (!res.ok) alert(data.error); else cargarClientes();
        }

        bindEvent('searchCliente', 'input', () => { paginaActualCli = 1; cargarClientes(); });

        bindSubmit('formCliente', 'modalCliente', async () => {
            const id = document.getElementById('clienteId').value;
            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API}/clientes/${id}` : `${API}/clientes`;

            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    dni: document.getElementById('cliDni').value,
                    nombre_completo: document.getElementById('cliNombre').value,
                    telefono: document.getElementById('cliTelefono').value,
                    email: document.getElementById('cliEmail').value
                })
            });
            const data = await res.json();
            if (!res.ok) { alert(data.error); throw new Error(data.error); }
            await cargarClientes();
        });

        // Carga inicial
        cargarClientes();
    </script>
</body>
</html>
