<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Pastelería</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        // 1. Obtener la sesión guardada
        const usuarioGuardado = JSON.parse(localStorage.getItem('usuarioLogueado'));

        // 2. Verificar si no existe usuario O si el usuario NO es Administrador
        if (!usuarioGuardado || !usuarioGuardado.nombre_rol || usuarioGuardado.nombre_rol.toLowerCase() !== 'administrador') {
            // Redirigir al login
            // Si tu servidor Express sirve la carpeta 'views' como estática, usa '/login.html'
            // Si accedes directamente por archivo/ruta relativa, usa '../login.html'
            window.location.href = '../login.html'; 
        }
    </script>
</head>
<body class="bg-light">

    <!-- Header Compartido -->
    <div id="header-container"></div>

    <div class="container mt-5 text-center">
        <div class="p-5 mb-4 bg-white rounded-3 shadow-sm">
            <div class="container-fluid py-5">
                <h1 class="display-5 fw-bold text-success">Panel de Administración</h1>
                <p class="col-md-8 fs-4 mx-auto text-muted mt-3">
                    Bienvenido al sistema de gestión interna de la pastelería artesanal. Utiliza la barra de navegación superior para administrar roles, categorías, insumos, clientes, productos y recetas.
                </p>
                <div class="mt-4">
                    <a href="/dashboardCliente/index.html" class="btn btn-outline-dark btn-lg" target="_blank">🌐 Ver Menú Público del Cliente</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Carga automática del Header común
        fetch('../partials/header.html')
            .then(res => res.text())
            .then(data => {
                const headerContainer = document.getElementById('header-container');
                if (headerContainer) headerContainer.innerHTML = data;
            });
    </script>
</body>
</html>
