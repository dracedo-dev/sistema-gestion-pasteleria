<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Admin Pastelería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        const usuarioGuardado = JSON.parse(localStorage.getItem('usuarioLogueado'));
        if (!usuarioGuardado || !usuarioGuardado.nombre_rol || usuarioGuardado.nombre_rol.toLowerCase() !== 'administrador') {
            window.location.href = '../login.html'; 
        }
    </script>
</head>
<body class="bg-light">

    <div id="header-container"></div>

    <div class="container mt-4">
        <h2 class="mb-4">Gestión de Usuarios</h2>

        <div class="card shadow p-4 mb-4 bg-white rounded">
            <!-- 🌟 FILTROS Y BUSCADOR -->
            <div class="row mb-3 g-2">
                <div class="col-md-5">
                    <input type="text" id="searchUsuario" class="form-control" placeholder="Buscar por nombre o email...">
                </div>
                <div class="col-md-3">
                    <select id="filtroRol" class="form-select">
                        <option value="">Filtrar por Rol...</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select id="filtroEstado" class="form-select">
                        <option value="">Estados...</option>
                        <option value="activo">Activos</option>
                        <option value="inactivo">Inactivos</option>
                    </select>
                </div>
                <div class="col-md-2 text-end">
                    <button class="btn btn-success w-100" onclick="abrirModalUsuario()">+ Nuevo</button>
                </div>
            </div>

            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre Completo</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaUsuarios"></tbody>
            </table>

            <nav class="d-flex justify-content-between align-items-center mt-3" aria-label="Navegación de usuarios">
                <span id="infoPaginacion" class="text-muted small">Mostrando registros...</span>
                <ul class="pagination mb-0" id="paginacionUsuarios"></ul>
            </nav>
        </div>
    </div>

    <!-- MODAL CREAR / EDITAR USUARIO -->
    <div class="modal fade" id="modalUsuario" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="tituloModalUsuario">Registrar Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="formUsuario">
                    <div class="modal-body">
                        <input type="hidden" id="usuarioId">
                        <div class="mb-3">
                            <label class="form-label">Nombre Completo *</label>
                            <input type="text" id="usrNombre" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email *</label>
                            <input type="email" id="usrEmail" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rol Asignado *</label>
                            <select id="usrRol" class="form-select" required></select>
                        </div>
                        <div class="mb-3 d-none" id="divPasswordAdmin">
                            <label class="form-label">Contraseña de Acceso *</label>
                            <input type="password" id="usrPassword" class="form-control" placeholder="Contraseña para el panel">
                            <div class="form-text">Esta contraseña será requerida para que el usuario inicie sesión.</div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API = 'http://localhost:3000/api';
        let listaUsuariosCache = [];
        let usuariosFiltradosCache = [];
        let paginaActual = 1;
        const elementosPorPagina = 5;

        function obtenerHeaders() {
            const token = localStorage.getItem('token');
            return {
                'Content-Type': 'application/json',
                ...(token ? { 'Authorization': `Bearer ${token}` } : {})
            };
        }

        fetch('../partials/header.html')
            .then(res => res.text())
            .then(data => {
                const headerContainer = document.getElementById('header-container');
                if (headerContainer) headerContainer.innerHTML = data;
            });

        async function cargarRolesEnSelects() {
            try {
                const res = await fetch(`${API}/roles`, { headers: obtenerHeaders(), credentials: 'include' });
                const roles = await res.json();
                
                // Select del modal
                const selectModal = document.getElementById('usrRol');
                if (selectModal) {
                    selectModal.innerHTML = `<option value="">Seleccione un rol...</option>` +
                        roles.map(r => `<option value="${r.id_rol}">${r.nombre_rol}</option>`).join('');
                }

                // Select del filtro superior
                const selectFiltro = document.getElementById('filtroRol');
                if (selectFiltro) {
                    selectFiltro.innerHTML = `<option value="">Todos los roles</option>` +
                        roles.map(r => `<option value="${r.nombre_rol.toLowerCase()}">${r.nombre_rol}</option>`).join('');
                }
            } catch (err) { console.error('Error al cargar roles:', err); }
        }

        async function abrirModalUsuario() {
            document.getElementById('formUsuario').reset();
            document.getElementById('usuarioId').value = '';
            document.getElementById('tituloModalUsuario').innerText = 'Registrar Nuevo Usuario';
            
            const divPassword = document.getElementById('divPasswordAdmin');
            if (divPassword) divPassword.classList.add('d-none');
            const passInput = document.getElementById('usrPassword');
            if (passInput) passInput.required = false;

            await cargarRolesEnSelects();
            const modal = new bootstrap.Modal(document.getElementById('modalUsuario'));
            modal.show();
        }

        const cargarUsuarios = async () => {
            try {
                const res = await fetch(`${API}/usuarios`, { headers: obtenerHeaders(), credentials: 'include' });
                listaUsuariosCache = await res.json();
                aplicarFiltros();
            } catch (err) { console.error('Error al cargar usuarios:', err); }
        };

        // 🌟 Lógica unificada de Buscador y Filtros
        function aplicarFiltros() {
            const texto = document.getElementById('searchUsuario').value.toLowerCase();
            const rolFiltro = document.getElementById('filtroRol').value.toLowerCase();
            const estadoFiltro = document.getElementById('filtroEstado').value;

            usuariosFiltradosCache = listaUsuariosCache.filter(u => {
                const coincideTexto = u.nombre_completo.toLowerCase().includes(texto) || u.email.toLowerCase().includes(texto);
                const rolUsuario = (u.nombre_rol || '').toLowerCase();
                const coincideRol = !rolFiltro || rolUsuario === rolFiltro;
                
                let coincideEstado = true;
                if (estadoFiltro === 'activo') coincideEstado = u.activo === true;
                if (estadoFiltro === 'inactivo') coincideEstado = u.activo === false;

                return coincideTexto && coincideRol && coincideEstado;
            });

            paginaActual = 1;
            renderizarTablaUsuarios();
        }

        const renderizarTablaUsuarios = () => {
            const tbody = document.getElementById('tablaUsuarios');
            const paginacionUl = document.getElementById('paginacionUsuarios');
            const infoPaginacion = document.getElementById('infoPaginacion');
            if (!tbody) return;

            if (usuariosFiltradosCache.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">No se encontraron usuarios.</td></tr>`;
                if (paginacionUl) paginacionUl.innerHTML = '';
                if (infoPaginacion) infoPaginacion.innerText = 'Sin registros';
                return;
            }

            const totalRegistros = usuariosFiltradosCache.length;
            const totalPaginas = Math.ceil(totalRegistros / elementosPorPagina);
            if (paginaActual > totalPaginas) paginaActual = totalPaginas;
            if (paginaActual < 1) paginaActual = 1;

            const inicio = (paginaActual - 1) * elementosPorPagina;
            const fin = inicio + elementosPorPagina;
            const usuariosPaginados = usuariosFiltradosCache.slice(inicio, fin);

            if (infoPaginacion) {
                infoPaginacion.innerText = `Mostrando del ${inicio + 1} al ${Math.min(fin, totalRegistros)} de ${totalRegistros} usuarios`;
            }

            // 🌟 Verificamos si el usuario logueado es Administrador supremo para mostrar el botón de eliminar
            const esAdminTotal = usuarioGuardado && usuarioGuardado.nombre_rol.toLowerCase() === 'administrador';

            tbody.innerHTML = usuariosPaginados.map(u => `
                <tr>
                    <td>${u.id_usuario}</td>
                    <td class="fw-bold">${u.nombre_completo}</td>
                    <td>${u.email}</td>
                    <td><span class="badge bg-secondary">${u.nombre_rol || 'Sin Rol'}</span></td>
                    <td>
                        <button class="btn btn-sm ${u.activo ? 'btn-success' : 'btn-danger'}" onclick="toggleEstadoUsuario(${u.id_usuario})">
                            ${u.activo ? 'Activo' : 'Inactivo'}
                        </button>
                    </td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-primary me-1" title="Editar" onclick='prepararEditarUsuario(${u.id_usuario}, ${JSON.stringify(u.nombre_completo)}, ${JSON.stringify(u.email)}, ${u.id_rol})'>✏️</button>
                        ${esAdminTotal ? `<button class="btn btn-sm btn-danger" title="Eliminar" onclick="eliminarUsuario(${u.id_usuario})">🗑️</button>` : ''}
                    </td>
                </tr>
            `).join('');

            if (paginacionUl) {
                let htmlPaginacion = `<li class="page-item ${paginaActual === 1 ? 'disabled' : ''}"><button class="page-link" onclick="cambiarPagina(${paginaActual - 1})">Anterior</button></li>`;
                for (let i = 1; i <= totalPaginas; i++) {
                    htmlPaginacion += `<li class="page-item ${paginaActual === i ? 'active' : ''}"><button class="page-link" onclick="cambiarPagina(${i})">${i}</button></li>`;
                }
                htmlPaginacion += `<li class="page-item ${paginaActual === totalPaginas ? 'disabled' : ''}"><button class="page-link" onclick="cambiarPagina(${paginaActual + 1})">Siguiente</button></li>`;
                paginacionUl.innerHTML = htmlPaginacion;
            }
        };

        function cambiarPagina(p) { paginaActual = p; renderizarTablaUsuarios(); }

        async function toggleEstadoUsuario(id) {
            try {
                const res = await fetch(`${API}/usuarios/${id}/estado`, { method: 'PATCH', headers: obtenerHeaders(), credentials: 'include' });
                if (res.ok) cargarUsuarios();
                else { const data = await res.json(); alert(data.error); }
            } catch (err) { console.error(err); }
        }

        async function eliminarUsuario(id) {
            if (!confirm('¿Estás seguro de eliminar este usuario permanentemente?')) return;
            try {
                const res = await fetch(`${API}/usuarios/${id}`, { method: 'DELETE', headers: obtenerHeaders(), credentials: 'include' });
                const data = await res.json();
                if (res.ok) {
                    cargarUsuarios();
                } else {
                    alert(data.error || 'Error al eliminar');
                }
            } catch (err) { console.error(err); }
        }

        async function prepararEditarUsuario(id, nombre, email, idRol) {
            document.getElementById('usuarioId').value = id;
            document.getElementById('usrNombre').value = nombre;
            document.getElementById('usrEmail').value = email;
            document.getElementById('tituloModalUsuario').innerText = 'Editar Usuario';
            
            const divPassword = document.getElementById('divPasswordAdmin');
            if (divPassword) divPassword.classList.add('d-none');

            await cargarRolesEnSelects();
            document.getElementById('usrRol').value = idRol;
            
            const modal = new bootstrap.Modal(document.getElementById('modalUsuario'));
            modal.show();
        }

        // Eventos de Filtros y Buscador
        document.getElementById('searchUsuario').addEventListener('input', aplicarFiltros);
        document.getElementById('filtroRol').addEventListener('change', aplicarFiltros);
        document.getElementById('filtroEstado').addEventListener('change', aplicarFiltros);

        // Mostrar password si el rol seleccionado lo requiere (ej. Admin / Marketing)
        document.getElementById('usrRol').addEventListener('change', function() {
            const textoRol = this.options[this.selectedIndex].text.toLowerCase();
            const divPassword = document.getElementById('divPasswordAdmin');
            const passInput = document.getElementById('usrPassword');
            if (divPassword && passInput) {
                if (!textoRol.includes('cliente')) {
                    divPassword.classList.remove('d-none');
                    passInput.required = true;
                } else {
                    divPassword.classList.add('d-none');
                    passInput.required = false;
                    passInput.value = '';
                }
            }
        });

        const formUsuario = document.getElementById('formUsuario');
        if (formUsuario) {
            formUsuario.onsubmit = async (e) => {
                e.preventDefault();
                const id = document.getElementById('usuarioId').value;
                const method = id ? 'PUT' : 'POST';
                const url = id ? `${API}/usuarios/${id}` : `${API}/usuarios`;

                const datosUsuario = {
                    nombre_completo: document.getElementById('usrNombre').value,
                    email: document.getElementById('usrEmail').value,
                    id_rol: parseInt(document.getElementById('usrRol').value),
                    password: document.getElementById('usrPassword').value
                };

                try {
                    const res = await fetch(url, {
                        method,
                        headers: obtenerHeaders(),
                        credentials: 'include',
                        body: JSON.stringify(datosUsuario)
                    });
                    const data = await res.json();
                    if (!res.ok) { alert(data.error || 'Error al guardar'); return; }

                    bootstrap.Modal.getInstance(document.getElementById('modalUsuario')).hide();
                    cargarUsuarios();
                } catch (err) { console.error(err); }
            };
        }

        cargarRolesEnSelects();
        cargarUsuarios();
    </script>
</body>
</html>
