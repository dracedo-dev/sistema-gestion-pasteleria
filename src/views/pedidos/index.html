<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- Header Compartido -->
    <div id="header-container"></div>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-clipboard-list me-2"></i> Gestión de Pedidos</h2>
        </div>

        <!-- Buscador -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <input type="text" id="buscadorPedidos" class="form-control" placeholder="Buscar por código de pedido, cliente o email...">
            </div>
        </div>

        <!-- Tabla de Pedidos -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Código</th>
                                <th>Cliente</th>
                                <th>Fecha</th>
                                <th>Total</th>
                                <th>Canal</th>
                                <th>Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaPedidosBody">
                            <!-- Los datos se cargan dinámicamente con JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Modal de Detalle de Pedido -->
                <div class="modal fade" id="modalDetallePedido" tabindex="-1" aria-labelledby="modalDetalleLabel" aria-hidden="true">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <div class="modal-header bg-dark text-white">
                                <h5 class="modal-title" id="modalDetalleLabel"><i class="fas fa-receipt me-2"></i> Detalle del Pedido</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body" id="contenidoDetalleModal">
                                <!-- Se inyecta dinámicamente -->
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Paginación -->
                <nav class="mt-3">
                    <ul class="pagination justify-content-center" id="paginacionPedidos">
                        <!-- Generado dinámicamente -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Asegúrate de tener esta etiqueta de script de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API = '/api/pedidos';
        let pedidosGlobal = [];
        let paginaActual = 1;
        const porPagina = 8;

        async function cargarPedidos() {
            try {
                const res = await fetch(`${API}/admin/todos`);
                pedidosGlobal = await res.json();
                renderizarTabla(pedidosGlobal);
            } catch (error) {
                console.error("Error al cargar pedidos:", error);
            }
        }

        function renderizarTabla(pedidos) {
            const tbody = document.getElementById('tablaPedidosBody');
            tbody.innerHTML = '';

            const inicio = (paginaActual - 1) * porPagina;
            const fin = inicio + porPagina;
            const pedidosPagina = pedidos.slice(inicio, fin);

            if (pedidosPagina.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No se encontraron pedidos.</td></tr>`;
                renderizarPaginacion(0);
                return;
            }

            pedidosPagina.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${p.codigo_unico}</strong></td>
                    <td>
                        <div>${p.cliente_nombre}</div>
                        <small class="text-muted">${p.cliente_email || ''}</small>
                    </td>
                    <td>${new Date(p.fecha_pedido).toLocaleString()}</td>
                    <td>$${Number(p.monto_final).toFixed(2)}</td>
                    <td><span class="badge bg-secondary">${p.canal_notificacion}</span></td>
                    <td>
                        <select class="form-select form-select-sm select-estado" data-id="${p.id_pedido}">
                            <option value="Pendiente" ${p.estado_pedido === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
                            <option value="En preparación" ${p.estado_pedido === 'En preparación' ? 'selected' : ''}>En preparación</option>
                            <option value="Listo para retirar" ${p.estado_pedido === 'Listo para retirar' ? 'selected' : ''}>Listo para retirar</option>
                            <option value="Entregado" ${p.estado_pedido === 'Entregado' ? 'selected' : ''}>Entregado</option>
                        </select>
                    </td>
                    <td class="text-center">
                        <button class="btn btn-info btn-sm text-white me-1" onclick="verDetallePedido(${p.id_pedido})" title="Ver Detalle">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="eliminarPedido(${p.id_pedido})" title="Eliminar Pedido">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Event listener para actualizar estado al cambiar el select
            document.querySelectorAll('.select-estado').forEach(select => {
                select.addEventListener('change', async (e) => {
                    const idPedido = e.target.getAttribute('data-id');
                    const nuevoEstado = e.target.value;
                    await actualizarEstado(idPedido, nuevoEstado);
                });
            });

            renderizarPaginacion(pedidos.length);
        }

        async function actualizarEstado(id, estado) {
            try {
                const res = await fetch(`${API}/${id}/estado`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ estado_pedido: estado })
                });
                if (res.ok) {
                    alert('¡Estado del pedido actualizado con éxito!');
                    cargarPedidos();
                } else {
                    alert('Error al actualizar el estado.');
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function eliminarPedido(id) {
            if (!confirm('¿Estás seguro de eliminar este pedido?')) return;
            try {
                const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    cargarPedidos();
                } else {
                    alert('No se pudo eliminar el pedido.');
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderizarPaginacion(totalItems) {
            const totalPaginas = Math.ceil(totalItems / porPagina);
            const ul = document.getElementById('paginacionPedidos');
            ul.innerHTML = '';

            for (let i = 1; i <= totalPaginas; i++) {
                const li = document.createElement('li');
                li.className = `page-item ${i === paginaActual ? 'active' : ''}`;
                li.innerHTML = `<button class="page-link" onclick="cambiarPagina(${i})">${i}</button>`;
                ul.appendChild(li);
            }
        }

        function cambiarPagina(num) {
            paginaActual = num;
            renderizarTabla(pedidosGlobal);
        }

        // Filtro de búsqueda en tiempo real
        document.getElementById('buscadorPedidos').addEventListener('input', (e) => {
            const texto = e.target.value.toLowerCase();
            const filtrados = pedidosGlobal.filter(p => 
                p.codigo_unico.toLowerCase().includes(texto) ||
                p.cliente_nombre.toLowerCase().includes(texto) ||
                (p.cliente_email && p.cliente_email.toLowerCase().includes(texto))
            );
            paginaActual = 1;
            renderizarTabla(filtrados);
        });

        async function cargarHeader() {
            try {
                const response = await fetch('/partials/header.html'); 
                if (response.ok) {
                    const html = await response.text();
                    document.getElementById('header-container').innerHTML = html;
                } else {
                    console.error("No se pudo cargar el header.");
                }
            } catch (error) {
                console.error("Error de red al cargar el header:", error);
            }
        }

        async function verDetallePedido(idPedido) {
            try {
                const res = await fetch(`${API}/admin/${idPedido}/detalle`);
                if (!res.ok) throw new Error('No se pudo obtener el detalle');
                
                const data = await res.json();
                const { pedido, items } = data;

                let htmlItems = '';
                items.forEach(item => {
                    let opcionesHtml = '';
                    if (item.opciones && item.opciones.length > 0) {
                        opcionesHtml = '<ul class="mb-0 ps-3"><small class="text-muted">';
                        item.opciones.forEach(op => {
                            opcionesHtml += `<li>${op.tipo_opcion}: ${op.nombre_opcion} ${op.costo_adicional > 0 ? `(+$${op.costo_adicional})` : ''}</li>`;
                        });
                        opcionesHtml += '</small></ul>';
                    }

                    const subtotalItem = Number(item.cantidad) * Number(item.precio_unitario);
                    htmlItems += `
                        <tr>
                            <td>
                                <strong>${item.producto_nombre || item.nombre_producto || 'Producto sin nombre'}</strong>
                                ${opcionesHtml}
                            </td>
                            <td class="text-center">${item.cantidad}</td>
                            <td class="text-end">$${Number(item.precio_unitario).toFixed(2)}</td>
                            <td class="text-end">$${subtotalItem.toFixed(2)}</td>
                        </tr>
                    `;
                });

                // 💳 Información de Pago y Previsualización Directa de la Imagen
                const metodoPago = pedido.metodo_pago || 'Efectivo al Retirar';
                let comprobanteHtml = '<span class="text-muted">Sin comprobante adjunto (Pago en efectivo)</span>';

                if (pedido.comprobante_pago) {
                    comprobanteHtml = `
                        <div class="mb-2">
                            <span class="fw-bold text-dark"><i class="fas fa-file-image me-1"></i> ${pedido.comprobante_pago}</span>
                        </div>
                        <div class="border rounded p-2 bg-white text-center">
                            <img src="/uploads/${pedido.comprobante_pago}" alt="Comprobante de Pago" class="img-fluid rounded shadow-sm" style="max-height: 250px; object-fit: contain;" onerror="this.onerror=null; this.src='https://placehold.co/400x200?text=Comprobante+no+encontrado';">
                        </div>
                        <div class="mt-2 text-end">
                            <a href="/uploads/${pedido.comprobante_pago}" target="_blank" class="btn btn-outline-secondary btn-sm">
                                <i class="fas fa-search-plus me-1"></i> Ver imagen en tamaño completo
                            </a>
                        </div>
                    `;
                }
                
                const estadoPagoBadge = pedido.pago_confirmado 
                    ? '<span class="badge bg-success">Confirmado ✅</span>' 
                    : '<span class="badge bg-warning text-dark">Pendiente de Verificación ⏳</span>';

                const contenido = `
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <p><strong>Código del Pedido:</strong> <span class="text-primary">${pedido.codigo_unico}</span></p>
                            <p><strong>Cliente:</strong> ${pedido.cliente_nombre}</p>
                            <p><strong>DNI:</strong> ${pedido.cliente_dni || 'No registrado'}</p>
                        </div>
                        <div class="col-md-6 text-md-end">
                            <p><strong>Fecha:</strong> ${new Date(pedido.fecha_pedido).toLocaleString()}</p>
                            <p><strong>Email:</strong> ${pedido.cliente_email}</p>
                            <p><strong>Teléfono:</strong> ${pedido.cliente_telefono || 'No registrado'}</p>
                            <p><strong>Estado:</strong> <span class="badge bg-info text-dark">${pedido.estado_pedido}</span></p>
                        </div>
                    </div>
                    <hr>
                    <h6>Productos Solicitados:</h6>
                    <div class="table-responsive">
                        <table class="table table-sm table-bordered align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Producto y Opciones</th>
                                    <th class="text-center">Cant.</th>
                                    <th class="text-end">P. Unitario</th>
                                    <th class="text-end">Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${htmlItems}
                            </tbody>
                        </table>
                    </div>
                    <div class="text-end mt-3 mb-4">
                        <h5>Total Final: <span class="text-success">$${Number(pedido.monto_final).toFixed(2)}</span></h5>
                    </div>

                    <!-- 💳 APARTADO DE PAGO Y VERIFICACIÓN -->
                    <hr>
                    <h5 class="fw-bold mb-3"><i class="fas fa-credit-card me-2"></i> Verificación de Pago</h5>
                    <div class="bg-light p-3 rounded mb-3 small">
                        <div class="mb-2"><strong>Método de Pago:</strong> ${metodoPago}</div>
                        <div class="mb-2"><strong>Comprobante de Pago:</strong></div>
                        ${comprobanteHtml}
                        <div class="mt-2"><strong>Estado Actual:</strong> ${estadoPagoBadge}</div>
                    </div>

                    <div class="d-flex gap-2">
                        <button class="btn btn-success btn-sm fw-bold w-50 py-2" onclick="cambiarEstadoPago(${pedido.id_pedido}, true)">
                            ✅ Confirmar Pago y Pedido
                        </button>
                        <button class="btn btn-danger btn-sm fw-bold w-50 py-2" onclick="pedirMotivoError(${pedido.id_pedido})">
                            ❌ Informar Error / Notificar
                        </button>
                    </div>
                `;

                document.getElementById('contenidoDetalleModal').innerHTML = contenido;

                const modal = new bootstrap.Modal(document.getElementById('modalDetallePedido'));
                modal.show();

            } catch (error) {
                console.error("Error al cargar detalle:", error);
                alert('Error al cargar el detalle del pedido.');
            }
        }

        // Funciones para manejar la verificación de pagos
        async function cambiarEstadoPago(idPedido, confirmado, motivo = '') {
            try {
                const res = await fetch(`${API}/${idPedido}/pago`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pago_confirmado: confirmado, motivo_error: motivo })
                });
                const data = await res.json();
                if (!res.ok) {
                    alert(data.error || 'Error al actualizar el pago');
                    return;
                }
                alert(confirmado ? '¡Pago confirmado con éxito! Se notificó al cliente por correo.' : 'Se ha notificado el error al cliente por correo. Recuerde comunicarse por WhatsApp.');
                location.reload(); 
            } catch (err) {
                console.error('Error:', err);
                alert('Error de conexión con el servidor.');
            }
        }

        function pedirMotivoError(idPedido) {
            const motivo = prompt('Ingrese el motivo del error en el pago o pedido (se le enviará por correo al cliente):', 'El comprobante no es legible o el monto no coincide.');
            if (motivo !== null) {
                cambiarEstadoPago(idPedido, false, motivo);
            }
        }

        // Ejecutar al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            cargarHeader();
            cargarPedidos();
        });
    </script>
</body>
</html>
