<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Pastelería Artesanal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🧁 Pastelería Artesanal</a>
            <div class="d-flex">
                <span id="nombreUsuarioLogueado" class="text-white align-self-center me-3"></span>
                <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal del Catálogo -->
    <div class="container my-4">
        <div class="row mb-4">
            <div class="col-12">
                <h2 class="fw-bold">Nuestro Menú</h2>
                <p class="text-muted">Elige tus productos favoritos y personaliza tu pedido</p>
            </div>
        </div>

        <!-- Grid de Productos -->
        <div class="row" id="catalogoProductos">
            <!-- Los productos se cargarán dinámicamente aquí -->
        </div>
    </div>

    <!-- Botón flotante del Carrito -->
    <div class="position-fixed bottom-0 end-0 m-4" style="z-index: 1000;">
        <button class="btn btn-primary rounded-circle p-3 shadow-lg position-relative" data-bs-toggle="offcanvas" data-bs-target="#offcanvasCarrito">
            🛒
            <span id="contadorCarrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
        </button>
    </div>

    <!-- Offcanvas / Sidebar del Carrito -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasCarrito">
        <div class="offcanvas-header bg-dark text-white">
            <h5 class="offcanvas-title">🛒 Tu Carrito de Compras</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column justify-content-between">
            <div id="listaCarrito" class="flex-grow-1 overflow-auto">
                <p class="text-muted text-center mt-4">El carrito está vacío.</p>
            </div>
            <div>
                <hr>
                <div class="d-flex justify-content-between mb-3">
                    <strong class="fs-5">Total:</strong>
                    <span id="totalCarrito" class="fs-5 fw-bold text-success">$0.00</span>
                </div>
                <button class="btn btn-success w-100 py-2 fw-bold" onclick="procesarPedido()">Confirmar Pedido</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE PERSONALIZACIÓN (TOPPINGS) -->
    <div class="modal fade" id="modalPersonalizar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="tituloModalProducto">Personalizar Producto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small">Selecciona los toppings o adicionales que deseas incluir:</p>
                    <div id="listaToppingsModal" class="mb-3">
                        <!-- Los toppings se cargan aquí dinámicamente -->
                        <p class="text-muted small">Cargando toppings...</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="confirmarAgregadoConToppings()">Añadir al Carrito</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const API = 'http://localhost:3000/api';
        let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        let productoSeleccionadoTemporal = null;

        const usuarioGuardado = JSON.parse(localStorage.getItem('usuarioLogueado'));
        if (usuarioGuardado && usuarioGuardado.nombre_completo) {
            document.getElementById('nombreUsuarioLogueado').innerText = `Hola, ${usuarioGuardado.nombre_completo}`;
        }

        function cerrarSesion() {
            localStorage.removeItem('usuarioLogueado');
            localStorage.removeItem('carrito');
            window.location.href = '../login.html';
        }

        // 1. Cargar Catálogo de Productos
        async function cargarCatalogoCliente() {
            try {
                const res = await fetch(`${API}/productos`);
                const productos = await res.json();
                
                const contenedor = document.getElementById('catalogoProductos');
                if (!contenedor) return;

                if (productos.length === 0) {
                    contenedor.innerHTML = `<div class="col-12 text-center text-muted">No hay productos disponibles.</div>`;
                    return;
                }

                contenedor.innerHTML = productos.map(p => {
                    const precioReal = p.precio_base ?? p.precio ?? p.precio_venta ?? 0;
                    return `
                        <div class="col-md-4 mb-4">
                            <div class="card h-100 shadow-sm border-0">
                                <div class="card-body d-flex flex-column justify-content-between">
                                    <div>
                                        <h5 class="card-title fw-bold text-dark">${p.nombre_producto}</h5>
                                        <p class="text-muted small">${p.descripcion || 'Delicioso producto artesanal.'}</p>
                                        <h6 class="text-success fw-bold fs-5">$${parseFloat(precioReal).toFixed(2)}</h6>
                                    </div>
                                    <button class="btn btn-outline-primary mt-3 w-100" onclick='abrirModalPersonalizacion(${JSON.stringify({...p, precio: precioReal})})'>
                                        Personalizar y Agregar 🛒
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error('Error al cargar catálogo:', err);
            }
        }

        // 2. Abrir Modal y cargar Toppings
        async function abrirModalPersonalizacion(producto) {
            productoSeleccionadoTemporal = producto;
            document.getElementById('tituloModalProducto').innerText = `Personalizar: ${producto.nombre_producto}`;
            
            // Mostrar modal de Bootstrap
            const modal = new bootstrap.Modal(document.getElementById('modalPersonalizar'));
            modal.show();

            // Cargar toppings desde el backend
            try {
                const res = await fetch(`${API}/insumos/toppings`);
                const toppings = await res.json();
                
                const contenedorToppings = document.getElementById('listaToppingsModal');
                if (toppings.length === 0) {
                    contenedorToppings.innerHTML = `<p class="text-muted small">No hay toppings disponibles.</p>`;
                    return;
                }

                contenedorToppings.innerHTML = toppings.map(t => `
                    <div class="form-check mb-2">
                        <input class="form-check-input topping-check" type="checkbox" value="${t.nombre_insumo}" data-id="${t.id_insumo}" id="topping_${t.id_insumo}">
                        <label class="form-check-label" for="topping_${t.id_insumo}">
                            ${t.nombre_insumo} <small class="text-muted">(Stock: ${t.stock_actual})</small>
                        </label>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Error al cargar toppings:', err);
            }
        }

        // 3. Confirmar adición con los toppings seleccionados al carrito
        function confirmarAgregadoConToppings() {
            if (!productoSeleccionadoTemporal) return;

            // Recolectar checkboxes marcados
            const checkboxes = document.querySelectorAll('.topping-check:checked');
            const opcionesSeleccionadas = Array.from(checkboxes).map(cb => ({
                tipo_opcion: 'Topping',
                nombre_opcion: cb.value,
                costo_adicional: 0 // Puedes asignarle costo si deseas
            }));

            // Creamos un identificador único para el carrito si el producto tiene combinaciones de opciones únicas, o agrupamos por ID
            const itemCarrito = {
                ...productoSeleccionadoTemporal,
                cantidad: 1,
                opciones: opcionesSeleccionadas
            };

            // Validar si ya existe el mismo producto con las mismas opciones (simplificado: por ID de producto)
            const index = carrito.findIndex(i => i.id_producto === itemCarrito.id_producto);
            if (index > -1) {
                carrito[index].cantidad += 1;
                carrito[index].opciones = opcionesSeleccionadas; // Actualiza opciones si cambió
            } else {
                carrito.push(itemCarrito);
            }

            guardarYActualizarCarrito();

            // Cerrar modal
            const modalEl = document.getElementById('modalPersonalizar');
            const modal = bootstrap.Modal.getInstance(modalEl);
            if (modal) modal.hide();

            alert('¡Producto agregado al carrito!');
        }

        // 4. Cambiar cantidad o eliminar desde el offcanvas
        function cambiarCantidad(id_producto, delta) {
            const item = carrito.find(i => i.id_producto === id_producto);
            if (item) {
                item.cantidad += delta;
                if (item.cantidad <= 0) {
                    carrito = carrito.filter(i => i.id_producto !== id_producto);
                }
            }
            guardarYActualizarCarrito();
        }

        function guardarYActualizarCarrito() {
            localStorage.setItem('carrito', JSON.stringify(carrito));
            renderizarCarrito();
        }

        function renderizarCarrito() {
            const lista = document.getElementById('listaCarrito');
            const contador = document.getElementById('contadorCarrito');
            const totalSpan = document.getElementById('totalCarrito');

            const totalItems = carrito.reduce((acc, item) => acc + item.cantidad, 0);
            contador.innerText = totalItems;

            if (carrito.length === 0) {
                lista.innerHTML = `<p class="text-muted text-center mt-4">El carrito está vacío.</p>`;
                totalSpan.innerText = '$0.00';
                return;
            }

            let total = 0;
            lista.innerHTML = carrito.map(item => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;

                // Renderizar los toppings seleccionados en el resumen del carrito si los tiene
                let htmlOpciones = '';
                if (item.opciones && item.opciones.length > 0) {
                    htmlOpciones = `<div class="small text-primary">Toppings: ${item.opciones.map(o => o.nombre_opcion).join(', ')}</div>`;
                }

                return `
                    <div class="mb-3 border-bottom pb-2">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="mb-0 fw-bold">${item.nombre_producto}</h6>
                                <small class="text-muted">$${parseFloat(item.precio).toFixed(2)} x ${item.cantidad}</small>
                                ${htmlOpciones}
                            </div>
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-secondary" onclick="cambiarCantidad(${item.id_producto}, -1)">-</button>
                                <button class="btn btn-outline-secondary disabled fw-bold text-dark">${item.cantidad}</button>
                                <button class="btn btn-outline-secondary" onclick="cambiarCantidad(${item.id_producto}, 1)">+</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            totalSpan.innerText = `$${total.toFixed(2)}`;
        }

        // 5. Procesar Pedido y enviarlo al Backend
        async function procesarPedido() {
            if (carrito.length === 0) {
                alert('Tu carrito está vacío.');
                return;
            }

            if (!usuarioGuardado || !usuarioGuardado.id_usuario) {
                alert('Debes iniciar sesión para confirmar el pedido.');
                window.location.href = '../login.html';
                return;
            }

            const montoSubtotal = carrito.reduce((acc, i) => acc + (i.precio * i.cantidad), 0);

            const datosPedido = {
                id_cliente: usuarioGuardado.id_usuario,
                monto_subtotal: montoSubtotal,
                monto_descuento: 0.00,
                monto_final: montoSubtotal,
                canal_notificacion: 'WhatsApp',
                items: carrito.map(i => ({
                    id_producto: i.id_producto,
                    cantidad: i.cantidad,
                    precio_unitario: i.precio,
                    opciones: i.opciones || []
                }))
            };

            try {
                const res = await fetch(`${API}/pedidos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datosPedido)
                });

                const data = await res.json();
                if (!res.ok) {
                    alert(data.error || 'Error al procesar el pedido');
                    return;
                }

                alert(`¡Pedido registrado con éxito! Código: ${data.codigo_unico}`);
                carrito = [];
                guardarYActualizarCarrito();
                
                const offcanvasEl = document.getElementById('offcanvasCarrito');
                const offcanvas = bootstrap.Offcanvas.getInstance(offcanvasEl);
                if (offcanvas) offcanvas.hide();

            } catch (err) {
                console.error('Error al enviar pedido:', err);
                alert('Error de conexión con el servidor.');
            }
        }

        // Inicializar al cargar
        cargarCatalogoCliente();
        renderizarCarrito();
    </script>
</body>
</html>
