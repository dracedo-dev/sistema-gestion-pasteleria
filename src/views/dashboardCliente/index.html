<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Pastelería Artesanal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🧁 Pastelería Artesanal</a>
            <div class="d-flex">
                <span id="nombreUsuarioLogueado" class="text-white align-self-center me-3"></span>
                <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal del Catálogo -->
    <div class="container my-4">
        <div class="row mb-4">
            <div class="col-12">
                <h2 class="fw-bold">Nuestro Menú</h2>
                <p class="text-muted">Elige tus productos favoritos y personaliza tu pedido</p>
            </div>
        </div>

        <!-- Grid de Productos -->
        <div class="row" id="catalogoProductos">
            <!-- Los productos se cargarán dinámicamente aquí -->
        </div>
    </div>

    <!-- Botón flotante del Carrito -->
    <div class="position-fixed bottom-0 end-0 m-4" style="z-index: 1000;">
        <button class="btn btn-primary rounded-circle p-3 shadow-lg position-relative" data-bs-toggle="offcanvas" data-bs-target="#offcanvasCarrito">
            🛒
            <span id="contadorCarrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
        </button>
    </div>

    <!-- Offcanvas / Sidebar del Carrito y Checkout -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasCarrito">
        <div class="offcanvas-header bg-dark text-white">
            <h5 class="offcanvas-title" id="tituloOffcanvas">🛒 Tu Carrito de Compras</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column justify-content-between">
            <!-- Contenedor dinámico que cambia entre Carrito y Checkout de Pago -->
            <div id="contenidoOffcanvas" class="flex-grow-1 overflow-auto">
                <!-- Se renderiza vía JS -->
            </div>
            
            <div id="footerOffcanvas">
                <!-- Botones de acción dinámicos -->
            </div>
        </div>
    </div>

    <!-- MODAL DE PERSONALIZACIÓN (TOPPINGS) -->
    <div class="modal fade" id="modalPersonalizar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="tituloModalProducto">Personalizar Producto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small">Selecciona los toppings o adicionales que deseas incluir:</p>
                    <div id="listaToppingsModal" class="mb-3">
                        <p class="text-muted small">Cargando toppings...</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="confirmarAgregadoConToppings()">Añadir al Carrito</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const API = 'http://localhost:3000/api';
        let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        let productoSeleccionadoTemporal = null;
        let tieneDescuentoFrecuencia = false; 
        let pasoActual = 'carrito'; // 'carrito' o 'pago'

        const usuarioGuardado = JSON.parse(localStorage.getItem('usuarioLogueado'));
        if (usuarioGuardado && usuarioGuardado.nombre_completo) {
            document.getElementById('nombreUsuarioLogueado').innerText = `Hola, ${usuarioGuardado.nombre_completo}`;
        }

        function cerrarSesion() {
            localStorage.removeItem('usuarioLogueado');
            localStorage.removeItem('carrito');
            window.location.href = '../login.html';
        }

        async function verificarDescuentoCliente() {
            if (!usuarioGuardado || !usuarioGuardado.id_cliente) return;
            try {
                const res = await fetch(`${API}/clientes`);
                const clientes = await res.json();
                const clienteActual = clientes.find(c => c.id_cliente === usuarioGuardado.id_cliente);
                
                if (clienteActual) {
                    const completados = clienteActual.pedidos_completados || 0;
                    if (completados > 0 && completados % 4 === 3) {
                        tieneDescuentoFrecuencia = true;
                        mostrarBannerDescuento();
                    }
                }
            } catch (err) {
                console.error('Error al verificar descuento del cliente:', err);
            }
        }

        function mostrarBannerDescuento() {
            const contenedorPrincipal = document.querySelector('.container.my-4');
            const banner = document.createElement('div');
            banner.className = 'alert alert-success alert-dismissible fade show shadow-sm mb-4';
            banner.innerHTML = `
                <strong>🎉 ¡Felicitaciones!</strong> Has alcanzado los pedidos requeridos. <strong>¡Tu próximo pedido tiene un 15% de descuento automático</strong> por cliente frecuente!
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            contenedorPrincipal.insertBefore(banner, contenedorPrincipal.firstChild);
        }

        async function cargarCatalogoCliente() {
            try {
                const res = await fetch(`${API}/productos`);
                const productos = await res.json();
                
                const contenedor = document.getElementById('catalogoProductos');
                if (!contenedor) return;

                if (productos.length === 0) {
                    contenedor.innerHTML = `<div class="col-12 text-center text-muted">No hay productos disponibles.</div>`;
                    return;
                }

                contenedor.innerHTML = productos.map(p => {
                    const precioReal = p.precio_base ?? p.precio ?? p.precio_venta ?? 0;
                    return `
                        <div class="col-md-4 mb-4">
                            <div class="card h-100 shadow-sm border-0">
                                <div class="card-body d-flex flex-column justify-content-between">
                                    <div>
                                        <h5 class="card-title fw-bold text-dark">${p.nombre_producto}</h5>
                                        <p class="text-muted small">${p.descripcion || 'Delicioso producto artesanal.'}</p>
                                        <h6 class="text-success fw-bold fs-5">$${parseFloat(precioReal).toFixed(2)}</h6>
                                    </div>
                                    <button class="btn btn-outline-primary mt-3 w-100" onclick='abrirModalPersonalizacion(${JSON.stringify({...p, precio: precioReal})})'>
                                        Personalizar y Agregar 🛒
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error('Error al cargar catálogo:', err);
            }
        }

        async function abrirModalPersonalizacion(producto) {
            productoSeleccionadoTemporal = producto;
            document.getElementById('tituloModalProducto').innerText = `Personalizar: ${producto.nombre_producto}`;
            
            const modal = new bootstrap.Modal(document.getElementById('modalPersonalizar'));
            modal.show();

            try {
                const res = await fetch(`${API}/insumos/toppings`);
                const toppings = await res.json();
                
                const contenedorToppings = document.getElementById('listaToppingsModal');
                if (toppings.length === 0) {
                    contenedorToppings.innerHTML = `<p class="text-muted small">No hay toppings disponibles.</p>`;
                    return;
                }

                contenedorToppings.innerHTML = toppings.map(t => `
                    <div class="form-check mb-2">
                        <input class="form-check-input topping-check" type="checkbox" value="${t.nombre_insumo}" data-id="${t.id_insumo}" id="topping_${t.id_insumo}">
                        <label class="form-check-label" for="topping_${t.id_insumo}">
                            ${t.nombre_insumo} <small class="text-muted">(Stock: ${t.stock_actual})</small>
                        </label>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Error al cargar toppings:', err);
            }
        }

        function confirmarAgregadoConToppings() {
            if (!productoSeleccionadoTemporal) return;

            const checkboxes = document.querySelectorAll('.topping-check:checked');
            const opcionesSeleccionadas = Array.from(checkboxes).map(cb => ({
                tipo_opcion: 'Topping',
                nombre_opcion: cb.value,
                costo_adicional: 0
            }));

            const itemCarrito = {
                ...productoSeleccionadoTemporal,
                cantidad: 1,
                opciones: opcionesSeleccionadas
            };

            const index = carrito.findIndex(i => i.id_producto === itemCarrito.id_producto);
            if (index > -1) {
                carrito[index].cantidad += 1;
                carrito[index].opciones = opcionesSeleccionadas;
            } else {
                carrito.push(itemCarrito);
            }

            guardarYActualizarCarrito();

            const modalEl = document.getElementById('modalPersonalizar');
            const modal = bootstrap.Modal.getInstance(modalEl);
            if (modal) modal.hide();

            alert('¡Producto agregado al carrito!');
        }

        function cambiarCantidad(id_producto, delta) {
            const item = carrito.find(i => i.id_producto === id_producto);
            if (item) {
                item.cantidad += delta;
                if (item.cantidad <= 0) {
                    carrito = carrito.filter(i => i.id_producto !== id_producto);
                }
            }
            guardarYActualizarCarrito();
        }

        function guardarYActualizarCarrito() {
            localStorage.setItem('carrito', JSON.stringify(carrito));
            renderizarCarrito();
        }

        // Renderizado Dinámico del Carrito o del Checkout según pasoActual
        function renderizarCarrito() {
            const contador = document.getElementById('contadorCarrito');
            const totalItems = carrito.reduce((acc, item) => acc + item.cantidad, 0);
            contador.innerText = totalItems;

            if (pasoActual === 'carrito') {
                document.getElementById('tituloOffcanvas').innerText = '🛒 Tu Carrito de Compras';
                renderizarVistaCarrito();
            } else {
                document.getElementById('tituloOffcanvas').innerText = '💳 Seleccionar Pago';
                renderizarVistaPago();
            }
        }

        function renderizarVistaCarrito() {
            const lista = document.getElementById('contenidoOffcanvas');
            const footer = document.getElementById('footerOffcanvas');

            if (carrito.length === 0) {
                lista.innerHTML = `<p class="text-muted text-center mt-4">El carrito está vacío.</p>`;
                footer.innerHTML = '';
                return;
            }

            let subtotalGeneral = 0;
            lista.innerHTML = carrito.map(item => {
                const subtotalItem = item.precio * item.cantidad;
                subtotalGeneral += subtotalItem;

                let htmlOpciones = '';
                if (item.opciones && item.opciones.length > 0) {
                    htmlOpciones = `<div class="small text-primary">Toppings: ${item.opciones.map(o => o.nombre_opcion).join(', ')}</div>`;
                }

                return `
                    <div class="mb-3 border-bottom pb-2">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="mb-0 fw-bold">${item.nombre_producto}</h6>
                                <small class="text-muted">$${parseFloat(item.precio).toFixed(2)} x ${item.cantidad}</small>
                                ${htmlOpciones}
                            </div>
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-secondary" onclick="cambiarCantidad(${item.id_producto}, -1)">-</button>
                                <button class="btn btn-outline-secondary disabled fw-bold text-dark">${item.cantidad}</button>
                                <button class="btn btn-outline-secondary" onclick="cambiarCantidad(${item.id_producto}, 1)">+</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            let descuento = 0;
            let htmlDescuento = '';
            if (tieneDescuentoFrecuencia) {
                descuento = subtotalGeneral * 0.15;
                htmlDescuento = `
                    <div class="d-flex justify-content-between mb-2 text-success small">
                        <span>Descuento Frecuente (15% OFF):</span>
                        <span>-$${descuento.toFixed(2)}</span>
                    </div>
                `;
            }

            const totalFinal = subtotalGeneral - descuento;

            footer.innerHTML = `
                <hr>
                ${htmlDescuento}
                <div class="d-flex justify-content-between mb-3">
                    <strong class="fs-5">Total:</strong>
                    <span class="fs-5 fw-bold text-success">$${totalFinal.toFixed(2)}</span>
                </div>
                <button class="btn btn-success w-100 py-2 fw-bold" onclick="irAlCheckout()">Continuar al Pago ➡️</button>
            `;
        }

        function irAlCheckout() {
            if (carrito.length === 0) {
                alert('Tu carrito está vacío.');
                return;
            }
            pasoActual = 'pago';
            renderizarCarrito();
        }

        function volverAlCarrito() {
            pasoActual = 'carrito';
            renderizarCarrito();
        }

        function renderizarVistaPago() {
            const contenedor = document.getElementById('contenidoOffcanvas');
            const footer = document.getElementById('footerOffcanvas');

            const subtotalGeneral = carrito.reduce((acc, i) => acc + (i.precio * i.cantidad), 0);
            const descuento = tieneDescuentoFrecuencia ? subtotalGeneral * 0.15 : 0;
            const totalFinal = subtotalGeneral - descuento;

            contenedor.innerHTML = `
                <div class="py-2">
                    <h6 class="fw-bold mb-3">Resumen de tu Pedido</h6>
                    <div class="bg-light p-3 rounded mb-4 small">
                        <div class="d-flex justify-content-between"><span>Subtotal:</span> <span>$${subtotalGeneral.toFixed(2)}</span></div>
                        ${tieneDescuentoFrecuencia ? `<div class="d-flex justify-content-between text-success"><span>Descuento (15%):</span> <span>-$${descuento.toFixed(2)}</span></div>` : ''}
                        <hr class="my-2">
                        <div class="d-flex justify-content-between fw-bold fs-6"><span>Total Final:</span> <span class="text-success">$${totalFinal.toFixed(2)}</span></div>
                    </div>

                    <h6 class="fw-bold mb-3">Selecciona el Medio de Pago</h6>
                    <div class="mb-3">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="metodoPago" id="pagoTransferencia" value="Transferencia Bancaria" checked onchange="toggleComprobante()">
                            <label class="form-check-label" for="pagoTransferencia">Transferencia Bancaria (Alias/CBU)</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="metodoPago" id="pagoMercadoPago" value="Mercado Pago" onchange="toggleComprobante()">
                            <label class="form-check-label" for="pagoMercadoPago">Mercado Pago (Alias)</label>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="radio" name="metodoPago" id="pagoEfectivo" value="Efectivo al Retirar" onchange="toggleComprobante()">
                            <label class="form-check-label" for="pagoEfectivo">Efectivo al Retirar en Local</label>
                        </div>
                    </div>

                    <!-- Sección Comprobante (Dinámica) -->
                    <div id="seccionComprobante" class="mb-3">
                        <label class="form-label fw-bold small">Adjuntar Comprobante de Pago:</label>
                        <input class="form-control form-control-sm" type="file" id="inputComprobante" accept="image/*,.pdf">
                        <small class="text-muted" style="font-size: 0.75rem;">Sube captura de pantalla o PDF de la transferencia.</small>
                    </div>
                </div>
            `;

            footer.innerHTML = `
                <hr>
                <button class="btn btn-primary w-100 py-2 fw-bold mb-2" onclick="procesarPedidoConPago()">Confirmar y Enviar Pedido 🚀</button>
                <button class="btn btn-outline-secondary w-100 btn-sm" onclick="volverAlCarrito()">⬅️ Volver al Carrito</button>
            `;
        }

        function toggleComprobante() {
            const efectivo = document.getElementById('pagoEfectivo').checked;
            const seccion = document.getElementById('seccionComprobante');
            if (efectivo) {
                seccion.style.display = 'none';
            } else {
                seccion.style.display = 'block';
            }
        }

        // 5. Procesar Pedido y enviarlo al Backend con Método y Comprobante
// 5. Procesar Pedido y enviarlo al Backend con FormData (Multer)
        async function procesarPedidoConPago() {
            // Asegurarnos de recuperar los datos actualizados del cliente desde localStorage
            const usuarioActual = JSON.parse(localStorage.getItem('usuarioLogueado'));

            if (!usuarioActual || !usuarioActual.id_cliente) {
                alert('No se encontró el perfil de cliente asociado a este usuario. Por favor vuelve a iniciar sesión.');
                window.location.href = '../login.html';
                return;
            }

            const metodoPago = document.querySelector('input[name="metodoPago"]:checked').value;
            const inputComp = document.getElementById('inputComprobante');

            const montoSubtotal = carrito.reduce((acc, i) => acc + (i.precio * i.cantidad), 0);
            const montoDescuento = tieneDescuentoFrecuencia ? montoSubtotal * 0.15 : 0;
            const montoFinal = montoSubtotal - montoDescuento;

            // 🌟 Creamos el objeto FormData para enviar archivos binarios y textos de forma conjunta
            const formData = new FormData();
            formData.append('id_cliente', usuarioActual.id_cliente);
            formData.append('monto_subtotal', montoSubtotal);
            formData.append('monto_descuento', montoDescuento);
            formData.append('monto_final', montoFinal);
            formData.append('canal_notificacion', 'WhatsApp');
            formData.append('metodo_pago', metodoPago);

            // Adjuntar el archivo físico si el método de pago lo requiere y fue seleccionado
            if (metodoPago !== 'Efectivo al Retirar' && inputComp && inputComp.files.length > 0) {
                formData.append('comprobante_pago', inputComp.files[0]); // 👈 El archivo real para Multer
            }

            // Como los ítems y opciones son objetos/arrays, los enviamos serializados como texto JSON
            formData.append('items', JSON.stringify(carrito.map(i => ({
                id_producto: i.id_producto,
                cantidad: i.cantidad,
                precio_unitario: i.precio,
                opciones: i.opciones || []
            }))));

            try {
                // ⚠️ IMPORTANTE: Al usar FormData, NO incluyas la cabecera 'Content-Type: application/json'. 
                // El navegador asigna automáticamente el multipart/form-data correcto.
                const res = await fetch(`${API}/pedidos`, {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();
                if (!res.ok) {
                    alert(data.error || 'Error al procesar el pedido');
                    return;
                }

                alert(`¡Pedido registrado con éxito! Código: ${data.codigo_unico}\nTe hemos enviado un correo con los detalles.`);
                
                carrito = [];
                pasoActual = 'carrito';
                guardarYActualizarCarrito();
                
                const offcanvasEl = document.getElementById('offcanvasCarrito');
                const offcanvas = bootstrap.Offcanvas.getInstance(offcanvasEl);
                if (offcanvas) offcanvas.hide();

                location.reload();

            } catch (err) {
                console.error('Error al enviar pedido:', err);
                alert('Error de conexión con el servidor.');
            }
        }

        // Inicializar al cargar
        verificarDescuentoCliente();
        cargarCatalogoCliente();
        renderizarCarrito();
    </script>
</body>
</html>
